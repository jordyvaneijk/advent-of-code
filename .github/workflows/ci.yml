name: Build and Test

on:
  push:
    branches:
      - '**'

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Print working directory
        run: cd

      - name: Restore dependencies
        run: dotnet restore ./src/AdventOfCode.Common/AdventOfCode.Common.slnx

      - name: Build
        run: dotnet build ./src/AdventOfCode.Common/AdventOfCode.Common.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./src/AdventOfCode.Common/Ved.AdventOfCode.Common.Tests/Ved.AdventOfCode.Common.Tests.csproj --no-build --configuration Release
